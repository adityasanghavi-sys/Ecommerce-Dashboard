<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEO E-Commerce Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body { background-color: #030712; color: #f9fafb; font-family: 'Inter', sans-serif; }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: #111827; }
      ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    </style>
  </head>
  <body class="p-4 md:p-8">
    
    <header class="mb-8 border-b border-gray-800 pb-4 flex justify-between items-end">
      <div>
        <h1 class="text-3xl font-bold tracking-tight text-white">Executive Performance</h1>
        <p class="text-gray-400 mt-1">Aggregated Daily Sales Overview (T-1)</p>
      </div>
      <div id="status-badge" class="px-3 py-1 bg-yellow-500/20 text-yellow-400 rounded-full text-sm font-medium border border-yellow-500/30">
        Fetching Live Data...
      </div>
    </header>

    <div id="kpi-grid" class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8 hidden">
      <div class="bg-gray-900 border border-gray-800 rounded-xl p-6 shadow-lg">
        <h3 class="text-gray-400 text-sm font-medium mb-1">Total GMV (₹)</h3>
        <p id="kpi-gmv" class="text-3xl font-bold text-green-400">0</p>
      </div>
      <div class="bg-gray-900 border border-gray-800 rounded-xl p-6 shadow-lg">
        <h3 class="text-gray-400 text-sm font-medium mb-1">Total Units Sold</h3>
        <p id="kpi-units" class="text-3xl font-bold text-white">0</p>
      </div>
      <div class="bg-gray-900 border border-gray-800 rounded-xl p-6 shadow-lg">
        <h3 class="text-gray-400 text-sm font-medium mb-1">Average Selling Price</h3>
        <p id="kpi-asp" class="text-3xl font-bold text-white">0</p>
      </div>
      <div class="bg-gray-900 border border-gray-800 rounded-xl p-6 shadow-lg">
        <h3 class="text-gray-400 text-sm font-medium mb-1">Top Platform</h3>
        <p id="kpi-platform" class="text-3xl font-bold text-blue-400">-</p>
      </div>
    </div>

    <div id="dashboard-content" class="hidden">
      <h2 class="text-xl font-semibold mb-4 text-gray-200">Raw Data Feed</h2>
      <div class="overflow-hidden rounded-xl border border-gray-800 bg-gray-900 shadow-xl">
        <div class="overflow-x-auto max-h-[500px]">
          <table class="w-full text-left text-sm">
            <thead class="sticky top-0 bg-gray-950 text-gray-400 border-b border-gray-800 shadow-sm z-10">
              <tr>
                <th class="px-6 py-4 font-medium">Date</th>
                <th class="px-6 py-4 font-medium">Platform</th>
                <th class="px-6 py-4 font-medium">Product Name</th>
                <th class="px-6 py-4 font-medium text-right">Units</th>
                <th class="px-6 py-4 font-medium text-right">GMV (₹)</th>
              </tr>
            </thead>
            <tbody id="table-body" class="divide-y divide-gray-800/50"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      // *** PASTE YOUR GOOGLE SCRIPT WEB APP URL HERE ***
      const API_URL = "https://script.google.com/macros/s/AKfycbwjmrasY2jMol0y3FHJ_vs2nVAGQgZ50yQIASQUWRQKXBRvhufqf9zlm5PNRetGM_fF/exec"; 

      window.onload = async function() {
        try {
          const response = await fetch(API_URL);
          const data = await response.json();
          processData(data);
        } catch (error) {
          console.error("Error:", error);
          const badge = document.getElementById('status-badge');
          badge.innerText = "Connection Error";
          badge.className = "px-3 py-1 bg-red-500/20 text-red-400 rounded-full text-sm font-medium border border-red-500/30";
        }
      };

      function processData(data) {
        if (!data || data.length === 0) return;

        let totalGMV = 0, totalUnits = 0, platformTotals = {};

        data.forEach(row => {
          let gmv = Number(row.GMV) || 0;
          let units = Number(row.Units) || 0;
          let platform = row.Platform || "Unknown";

          totalGMV += gmv;
          totalUnits += units;
          if(!platformTotals[platform]) platformTotals[platform] = 0;
          platformTotals[platform] += gmv;
        });

        let asp = totalUnits > 0 ? (totalGMV / totalUnits) : 0;
        let topPlatform = Object.keys(platformTotals).reduce((a, b) => platformTotals[a] > platformTotals[b] ? a : b);

        document.getElementById('kpi-gmv').innerText = '₹' + totalGMV.toLocaleString('en-IN', {maximumFractionDigits: 0});
        document.getElementById('kpi-units').innerText = totalUnits.toLocaleString('en-IN');
        document.getElementById('kpi-asp').innerText = '₹' + asp.toLocaleString('en-IN', {maximumFractionDigits: 1});
        document.getElementById('kpi-platform').innerText = topPlatform;

        const tbody = document.getElementById('table-body');
        let rowsHtml = '';
        
        data.forEach(row => {
          const dateObj = new Date(row.Date);
          const formattedDate = !isNaN(dateObj) ? dateObj.toLocaleDateString('en-IN', {day: 'numeric', month: 'short', year: 'numeric'}) : row.Date;
          const u = Number(row.Units).toLocaleString('en-IN');
          const g = Number(row.GMV).toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});

          rowsHtml += `
            <tr class="hover:bg-gray-800 transition-colors">
              <td class="px-6 py-4 whitespace-nowrap text-gray-300">${formattedDate}</td>
              <td class="px-6 py-4 whitespace-nowrap"><span class="inline-flex items-center rounded bg-gray-800 px-2 py-1 text-xs font-semibold text-gray-300 border border-gray-700">${row.Platform}</span></td>
              <td class="px-6 py-4 text-gray-200">${row['Product Name']}</td>
              <td class="px-6 py-4 text-right text-gray-300">${u}</td>
              <td class="px-6 py-4 text-right text-green-400 font-medium">₹${g}</td>
            </tr>
          `;
        });
        tbody.innerHTML = rowsHtml;

        document.getElementById('status-badge').innerText = "✓ Live & Synced";
        document.getElementById('status-badge').className = "px-3 py-1 bg-green-500/20 text-green-400 rounded-full text-sm font-medium border border-green-500/30";
        document.getElementById('kpi-grid').classList.remove('hidden');
        document.getElementById('dashboard-content').classList.remove('hidden');
      }
    </script>
  </body>
</html>
