<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snackible Executive Dashboard</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body { background-color: #0a0a0a; color: #f3f4f6; font-family: 'Inter', sans-serif; }
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0a0a0a; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }
    /* Hide scrollbar for tabs */
    .scrollbar-hide::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="selection:bg-blue-500/30">

  <nav class="sticky top-0 z-50 w-full border-b border-white/5 bg-[#0a0a0a]/80 backdrop-blur-md">
    <div class="max-w-[1600px] mx-auto px-4 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center font-bold text-white shadow-[0_0_15px_rgba(59,130,246,0.3)]">
          S
        </div>
        <span class="text-xl font-semibold tracking-tight">SNACKIBLE <span class="text-gray-500 font-normal">Analytics</span></span>
      </div>
      
      <div class="flex items-center gap-4">
        <div class="relative hidden md:block">
          <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
          <input type="text" placeholder="Search products, SKUs..." class="bg-white/5 border border-white/10 rounded-full py-1.5 pl-9 pr-4 text-sm text-gray-200 focus:outline-none focus:border-blue-500/50 w-64 transition-all">
        </div>
        <button class="p-2 hover:bg-white/5 rounded-full relative transition">
          <i data-lucide="bell" class="w-5 h-5 text-gray-400"></i>
          <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full border border-[#0a0a0a]"></span>
        </button>
        <button class="p-2 hover:bg-white/5 rounded-full transition">
          <i data-lucide="settings" class="w-5 h-5 text-gray-400"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="max-w-[1600px] mx-auto px-4 lg:px-8 pb-12">
    
    <div class="pt-8 pb-2">
      <h1 class="text-3xl font-bold tracking-tight mb-6">Executive Overview</h1>
      <div class="flex space-x-1 border-b border-white/10 overflow-x-auto scrollbar-hide" id="tab-container">
        </div>
    </div>

    <div class="sticky top-16 z-40 py-4 bg-[#0a0a0a]/90 backdrop-blur-md border-b border-white/5 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <button class="flex items-center gap-2 bg-white/5 hover:bg-white/10 border border-white/10 rounded-lg px-3 py-1.5 text-sm font-medium transition">
          <i data-lucide="calendar" class="w-4 h-4 text-gray-400"></i> Last 7 Days <i data-lucide="chevron-down" class="w-4 h-4 text-gray-500"></i>
        </button>
        <div class="h-6 w-px bg-white/10 mx-1"></div>
        <div class="flex bg-white/5 rounded-lg p-0.5 border border-white/10">
          <button class="px-3 py-1 text-xs font-medium rounded-md bg-white/10 text-white shadow-sm">Daily</button>
          <button class="px-3 py-1 text-xs font-medium rounded-md text-gray-400 hover:text-gray-200">Weekly</button>
          <button class="px-3 py-1 text-xs font-medium rounded-md text-gray-400 hover:text-gray-200">Monthly</button>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button class="flex items-center gap-2 bg-white/5 hover:bg-white/10 border border-white/10 rounded-lg px-3 py-1.5 text-sm font-medium transition">
          <i data-lucide="filter" class="w-4 h-4 text-gray-400"></i> All Platforms <i data-lucide="chevron-down" class="w-4 h-4 text-gray-500"></i>
        </button>
        <button class="bg-blue-500/10 hover:bg-blue-500/20 text-blue-400 border border-blue-500/20 rounded-lg px-4 py-1.5 text-sm font-medium transition">
          Compare: Prev Period
        </button>
      </div>
    </div>

    <main class="mt-6 flex flex-col gap-6">
      
      <div class="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-8 gap-4" id="kpi-grid">
        </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="lg:col-span-2 flex flex-col gap-6">
          <div class="h-96 rounded-xl bg-white/[0.02] border border-white/5 flex items-center justify-center text-gray-600 border-dashed">Main Chart Area (Step 4)</div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="h-72 rounded-xl bg-white/[0.02] border border-white/5 flex items-center justify-center text-gray-600 border-dashed">Platform Split (Step 4)</div>
            <div class="h-72 rounded-xl bg-white/[0.02] border border-white/5 flex items-center justify-center text-gray-600 border-dashed">Category Trend (Step 4)</div>
          </div>
          <div class="h-96 rounded-xl bg-white/[0.02] border border-white/5 flex items-center justify-center text-gray-600 border-dashed">Data Table Area (Step 6)</div>
        </div>
        
        <div class="lg:col-span-1 flex flex-col gap-6">
          <div class="h-80 rounded-xl bg-white/[0.02] border border-white/5 flex items-center justify-center text-gray-600 border-dashed">AI Insights Panel (Step 7)</div>
          <div class="h-64 rounded-xl bg-white/[0.02] border border-white/5 flex items-center justify-center text-gray-600 border-dashed">Alerts Engine (Step 7)</div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // Initialize standard icons
    lucide.createIcons();

    // Setup Tabs Logic
    const tabs = [
      { name: 'Overview', icon: 'layout-dashboard' },
      { name: 'Platform View', icon: 'shopping-cart' },
      { name: 'Product View', icon: 'package' },
      { name: 'Marketing', icon: 'trending-up' },
      { name: 'Finance', icon: 'dollar-sign' }
    ];

    let activeTab = 'Overview';
    const tabContainer = document.getElementById('tab-container');

    function renderTabs() {
      tabContainer.innerHTML = tabs.map(tab => {
        const isActive = activeTab === tab.name;
        const colorClass = isActive ? 'border-blue-500 text-blue-400' : 'border-transparent text-gray-400 hover:text-gray-200 hover:border-white/20';
        return `
          <button onclick="setActiveTab('${tab.name}')" class="flex items-center gap-2 px-4 py-3 text-sm font-medium border-b-2 transition-all whitespace-nowrap ${colorClass}">
            <i data-lucide="${tab.icon}" class="w-4 h-4"></i> ${tab.name}
          </button>
        `;
      }).join('');
      lucide.createIcons(); // Re-render icons after DOM update
    }

    function setActiveTab(tabName) {
      activeTab = tabName;
      renderTabs();
      // Logic to switch views will go here later
    }

    // Generate KPI Placeholders
    document.getElementById('kpi-grid').innerHTML = Array(8).fill(`
      <div class="h-28 rounded-xl bg-white/[0.02] border border-white/5 animate-pulse"></div>
    `).join('');

    renderTabs();
  </script>
</body>
</html>
