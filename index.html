<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snackible Executive Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #0a0a0a; color: #f3f4f6; font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0a0a0a; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .apexcharts-tooltip { background: #111 !important; border: 1px border-white/10 !important; color: #fff; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); }
    .apexcharts-tooltip-title { background: #000 !important; border-bottom: 1px solid #333 !important; }
    
    /* Dark Theme styling for the native calendar pickers */
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
  </style>
</head>
<body class="selection:bg-blue-500/30">

  <nav class="sticky top-0 z-50 w-full border-b border-white/5 bg-[#0a0a0a]/80 backdrop-blur-md">
    <div class="max-w-[1600px] mx-auto px-4 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center font-bold text-white shadow-[0_0_15px_rgba(59,130,246,0.3)]">S</div>
        <span class="text-xl font-semibold tracking-tight">SNACKIBLE <span class="text-gray-500 font-normal">Analytics</span></span>
      </div>
      <div class="flex items-center gap-4">
        <button class="p-2 hover:bg-white/5 rounded-full relative transition">
          <i data-lucide="bell" class="w-5 h-5 text-gray-400"></i>
          <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full border border-[#0a0a0a]"></span>
        </button>
      </div>
    </div>
  </nav>

  <div class="max-w-[1600px] mx-auto px-4 lg:px-8 pb-12">
    
    <div class="pt-8 pb-2">
      <h1 class="text-3xl font-bold tracking-tight mb-6">Executive Overview</h1>
      <div class="flex space-x-1 border-b border-white/10 overflow-x-auto scrollbar-hide" id="tab-container"></div>
    </div>

    <div class="sticky top-16 z-40 py-4 bg-[#0a0a0a]/90 backdrop-blur-md border-b border-white/5 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3 flex-wrap">
        
        <div class="relative flex items-center bg-white/5 hover:bg-white/10 border border-white/10 rounded-lg px-3 py-1.5 transition-colors">
          <i data-lucide="calendar" class="w-4 h-4 text-gray-400 mr-2"></i>
          <select id="dateFilter" onchange="setDateRange(this.value)" class="bg-transparent text-sm font-medium text-gray-200 outline-none appearance-none cursor-pointer pr-4">
            <option value="latest" class="bg-gray-900 text-white">Latest Day</option>
            <option value="7d" class="bg-gray-900 text-white">Last 7 Days</option>
            <option value="30d" class="bg-gray-900 text-white">Last 30 Days</option>
            <option value="all" class="bg-gray-900 text-white" selected>All Time</option>
            <option value="custom" class="bg-gray-900 text-blue-400">Custom Range...</option>
          </select>
          <i data-lucide="chevron-down" class="w-4 h-4 text-gray-500 absolute right-2 pointer-events-none"></i>
        </div>

        <div id="custom-date-picker" class="hidden items-center gap-2 bg-white/5 border border-white/10 rounded-lg px-2 py-1 transition-colors">
          <input type="date" id="startDate" onchange="applyFilters()" class="bg-transparent text-sm text-gray-300 outline-none cursor-pointer">
          <span class="text-gray-500 text-sm">to</span>
          <input type="date" id="endDate" onchange="applyFilters()" class="bg-transparent text-sm text-gray-300 outline-none cursor-pointer">
        </div>

      </div>
      
      <div class="flex items-center gap-3">
        <div class="relative flex items-center bg-white/5 hover:bg-white/10 border border-white/10 rounded-lg px-3 py-1.5 transition-colors">
          <i data-lucide="filter" class="w-4 h-4 text-gray-400 mr-2"></i>
          <select id="platformFilter" onchange="setPlatform(this.value)" class="bg-transparent text-sm font-medium text-gray-200 outline-none appearance-none cursor-pointer pr-4">
            <option value="All" class="bg-gray-900 text-white">All Platforms</option>
            <option value="Blinkit" class="bg-gray-900 text-white">Blinkit</option>
            <option value="Zepto" class="bg-gray-900 text-white">Zepto</option>
            <option value="Instamart" class="bg-gray-900 text-white">Instamart</option>
            <option value="Big Basket" class="bg-gray-900 text-white">Big Basket</option>
          </select>
          <i data-lucide="chevron-down" class="w-4 h-4 text-gray-500 absolute right-2 pointer-events-none"></i>
        </div>
      </div>
    </div>

    <main class="mt-6 flex flex-col gap-6">
      <div class="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-6 gap-4" id="kpi-grid"></div>

      <div id="dashboard-content" class="flex flex-col gap-6">
        <div id="platform-summary-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4"></div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <div class="lg:col-span-2 flex flex-col gap-6">
            <div class="h-[400px] rounded-xl bg-[#111111] border border-white/5 p-5 shadow-lg">
              <h3 class="text-sm font-semibold text-gray-300 mb-2">Daily GMV Trend (₹)</h3>
              <div id="chart-daily-trend" class="w-full h-full pb-6"></div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div class="h-[350px] rounded-xl bg-[#111111] border border-white/5 p-5 shadow-lg">
                <h3 class="text-sm font-semibold text-gray-300 mb-2">Platform Contribution</h3>
                <div id="chart-platform-share" class="w-full h-full pb-4 flex justify-center"></div>
              </div>
              <div class="h-[350px] rounded-xl bg-[#111111] border border-white/5 p-5 shadow-lg">
                <h3 class="text-sm font-semibold text-gray-300 mb-2">Top 5 Products by GMV</h3>
                <div id="chart-top-products" class="w-full h-full pb-4"></div>
              </div>
            </div>
          </div>
          
          <div class="lg:col-span-1 flex flex-col gap-6">
            <div class="h-80 rounded-xl bg-white/[0.02] border border-white/5 flex items-center justify-center text-gray-600 border-dashed">AI Insights Panel (Step 7)</div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    lucide.createIcons();
    const filters = { dateRange: 'all', platform: 'All', tab: 'Overview' };
    let rawData = [];
    let chartInstances = {}; 
    // --- FIXED MONTHLY BUDGETS (Zepto & Instamart Only) ---
    const monthlyBudgets = {
      'Zepto': 2070000,      // 20.7 Lakhs
      'Blinkit': 0,          
      'Instamart': 1275000,  // 12.75 Lakhs (Swiggy)
      'Big Basket': 0        
    };

    const tabs = [{ name: 'Overview', icon: 'layout-dashboard' }, { name: 'Platform View', icon: 'shopping-cart' }, { name: 'Product View', icon: 'package' }];

    function renderTabs() {
      document.getElementById('tab-container').innerHTML = tabs.map(tab => {
        const c = filters.tab === tab.name ? 'border-orange-500 text-orange-400' : 'border-transparent text-gray-400 hover:text-gray-200 hover:border-white/20';
        return `<button onclick="setActiveTab('${tab.name}')" class="flex items-center gap-2 px-4 py-3 text-sm font-medium border-b-2 transition-all whitespace-nowrap ${c}"><i data-lucide="${tab.icon}" class="w-4 h-4"></i> ${tab.name}</button>`;
      }).join('');
      lucide.createIcons(); 
    }

    // *** PASTE YOUR GOOGLE API URL HERE ***
    const API_URL = "https://script.google.com/macros/s/AKfycbwjmrasY2jMol0y3FHJ_vs2nVAGQgZ50yQIASQUWRQKXBRvhufqf9zlm5PNRetGM_fF/exec";

    async function fetchAndRenderData() {
      try {
        const response = await fetch(API_URL);
        rawData = await response.json();
        
        // Auto-set the date pickers to the latest date available so they aren't blank
        if (rawData.length > 0) {
          const maxTime = Math.max(...rawData.map(r => new Date(r.Date).getTime()).filter(t => !isNaN(t)));
          const maxDateStr = new Date(maxTime).toISOString().split('T')[0];
          document.getElementById('startDate').value = maxDateStr;
          document.getElementById('endDate').value = maxDateStr;
        }

        applyFilters(); 
      } catch (error) {
        console.error("Connection Error:", error);
      }
    }

    function setDateRange(val) { 
      filters.dateRange = val; 
      
      // Show/Hide the custom date picker inputs
      const customPicker = document.getElementById('custom-date-picker');
      if (val === 'custom') {
        customPicker.classList.remove('hidden');
        customPicker.classList.add('flex');
      } else {
        customPicker.classList.add('hidden');
        customPicker.classList.remove('flex');
      }
      
      applyFilters(); 
    }
    
    function setPlatform(val) { filters.platform = val; applyFilters(); }
    function setActiveTab(tabName) { filters.tab = tabName; renderTabs(); applyFilters(); }

    function applyFilters() {
      const isOverview = filters.tab === 'Overview';
      document.getElementById('kpi-grid').style.display = isOverview ? 'grid' : 'none';
      document.getElementById('dashboard-content').style.display = isOverview ? 'flex' : 'none';
      
      if (!isOverview || !rawData.length) return;

      // 1. Find the Absolute Latest Date in the Dataset
      const dates = rawData.map(r => new Date(r.Date).getTime()).filter(t => !isNaN(t));
      const maxDate = new Date(Math.max(...dates));
      maxDate.setHours(0,0,0,0);
      
      const filteredData = rawData.filter(row => {
        const rowDate = new Date(row.Date);
        rowDate.setHours(0,0,0,0);
        
        const pName = String(row.Platform).toLowerCase();
        
        // --- Date Logic Engine ---
        let dateMatch = false;
        if (filters.dateRange === 'all') {
          dateMatch = true;
        } else if (filters.dateRange === 'latest') {
          dateMatch = rowDate.getTime() === maxDate.getTime();
        } else if (filters.dateRange === '7d') {
          let cutoff = new Date(maxDate); cutoff.setDate(cutoff.getDate() - 7);
          dateMatch = rowDate > cutoff && rowDate <= maxDate;
        } else if (filters.dateRange === '30d') {
          let cutoff = new Date(maxDate); cutoff.setDate(cutoff.getDate() - 30);
          dateMatch = rowDate > cutoff && rowDate <= maxDate;
        } else if (filters.dateRange === 'custom') {
          let sVal = document.getElementById('startDate').value;
          let eVal = document.getElementById('endDate').value;
          let sDate = sVal ? new Date(sVal) : new Date(0);
          let eDate = eVal ? new Date(eVal) : new Date('2999-01-01');
          sDate.setHours(0,0,0,0); eDate.setHours(0,0,0,0);
          dateMatch = rowDate >= sDate && rowDate <= eDate;
        }

        // --- Platform Logic Engine ---
        const platMatch = filters.platform === 'All' || pName.includes(filters.platform.toLowerCase());
        
        return dateMatch && platMatch;
      });

      calculateAndRenderKPIs(filteredData);
      renderPlatformSummaries(filteredData);
      renderCharts(filteredData);
    }

    function formatNumber(num, isCurrency = true) {
      if (!num) return isCurrency ? '₹0' : '0';
      let formatted = num >= 100000 ? (num / 100000).toFixed(1) + 'L' : num >= 1000 ? (num / 1000).toFixed(1) + 'K' : num.toFixed(0);
      return isCurrency ? '₹' + formatted : formatted;
    }

    function calculateAndRenderKPIs(data) {
      let totalGmv = 0, totalUnits = 0;
      let platforms = { 'Zepto': 0, 'Blinkit': 0, 'Instamart': 0, 'Big Basket': 0 };

      data.forEach(row => {
        let gmv = Number(row.GMV) || 0;
        let units = Number(row.Units) || 0;
        let pName = String(row.Platform).toLowerCase();
        
        totalGmv += gmv; 
        totalUnits += units; 

        if (pName.includes('zepto')) platforms['Zepto'] += gmv;
        else if (pName.includes('blinkit')) platforms['Blinkit'] += gmv;
        else if (pName.includes('swiggy') || pName.includes('instamart')) platforms['Instamart'] += gmv;
        else if (pName.includes('big basket') || pName.includes('bigbasket')) platforms['Big Basket'] += gmv;
      });

// Calculate Fixed Spends & Pacing ROAS (Only using platforms with budgets)
      let totalSpends = monthlyBudgets['Zepto'] + monthlyBudgets['Instamart'];
      let roasGmv = platforms['Zepto'] + platforms['Instamart']; // Only use sales from ad-backed platforms
      let blendedRoas = totalSpends > 0 ? (roasGmv / totalSpends).toFixed(2) + 'x' : '--';

      document.getElementById('kpi-grid').innerHTML = `
        <div class="bg-[#111111] border border-white/5 rounded-xl p-5 shadow-lg border-t-2 border-t-orange-500 col-span-2 md:col-span-1 lg:col-span-2">
          <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Total Sales</h3>
          <p class="text-3xl font-bold text-white">${formatNumber(totalGmv)}</p>
        </div>
        
        <div class="bg-[#111111] border border-white/5 rounded-xl p-5 shadow-lg border-t-2 border-t-purple-500 col-span-2 md:col-span-1 lg:col-span-2">
          <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Total Ad Budget</h3>
          <p class="text-3xl font-bold text-white">${formatNumber(totalSpends)}</p>
        </div>

        <div class="bg-[#111111] border border-white/5 rounded-xl p-5 shadow-lg border-t-2 border-t-green-400 col-span-2 md:col-span-1 lg:col-span-2">
          <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Pacing ROAS</h3>
          <p class="text-3xl font-bold text-white">${blendedRoas}</p>
        </div>

        <div class="bg-[#111111] border border-white/5 rounded-xl p-5 shadow-lg border-t-2 border-t-gray-500 col-span-2 md:col-span-1 lg:col-span-2">
          <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Total Units</h3>
          <p class="text-3xl font-bold text-white">${formatNumber(totalUnits, false)}</p>
        </div>
        
        <div class="bg-[#111111] border border-white/5 rounded-xl p-4 shadow-lg border-t-2 border-t-blue-500 col-span-2 md:col-span-1 lg:col-span-2">
          <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Zepto</h3>
          <p class="text-xl font-bold text-white">${formatNumber(platforms['Zepto'])}</p>
          <p class="text-xs text-blue-400 mt-1">ROAS: ${(platforms['Zepto'] / monthlyBudgets['Zepto']).toFixed(2)}x</p>
        </div>

        <div class="bg-[#111111] border border-white/5 rounded-xl p-4 shadow-lg border-t-2 border-t-yellow-500 col-span-2 md:col-span-1 lg:col-span-2">
          <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Blinkit</h3>
          <p class="text-xl font-bold text-white">${formatNumber(platforms['Blinkit'])}</p>
          <p class="text-xs text-gray-600 mt-1">ROAS: --</p>
        </div>

        <div class="bg-[#111111] border border-white/5 rounded-xl p-4 shadow-lg border-t-2 border-t-green-500 col-span-2 md:col-span-1 lg:col-span-2">
          <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Instamart</h3>
          <p class="text-xl font-bold text-white">${formatNumber(platforms['Instamart'])}</p>
          <p class="text-xs text-green-400 mt-1">ROAS: ${(platforms['Instamart'] / monthlyBudgets['Instamart']).toFixed(2)}x</p>
        </div>

        <div class="bg-[#111111] border border-white/5 rounded-xl p-4 shadow-lg border-t-2 border-t-red-600 col-span-2 md:col-span-1 lg:col-span-2">
          <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">BigBasket</h3>
          <p class="text-xl font-bold text-white">${formatNumber(platforms['Big Basket'])}</p>
          <p class="text-xs text-gray-600 mt-1">ROAS: --</p>
        </div>
      `;
    }

    function renderPlatformSummaries(data) {
      let pStats = {
        'Zepto': { gmv: 0, units: 0, days: new Set(), color: 'text-blue-500' },
        'Blinkit': { gmv: 0, units: 0, days: new Set(), color: 'text-yellow-500' },
        'Instamart': { gmv: 0, units: 0, days: new Set(), color: 'text-green-500' },
        'Big Basket': { gmv: 0, units: 0, days: new Set(), color: 'text-red-500' }
      };

      let allUniqueDays = new Set();

      data.forEach(row => {
        let gmv = Number(row.GMV) || 0;
        let units = Number(row.Units) || 0;
        let pName = String(row.Platform).toLowerCase();
        let dateStr = new Date(row.Date).toDateString();

        allUniqueDays.add(dateStr);

        let matchedKey = null;
        if (pName.includes('zepto')) matchedKey = 'Zepto';
        else if (pName.includes('blinkit')) matchedKey = 'Blinkit';
        else if (pName.includes('swiggy') || pName.includes('instamart')) matchedKey = 'Instamart';
        else if (pName.includes('big basket') || pName.includes('bigbasket')) matchedKey = 'Big Basket';

        if (matchedKey) {
          pStats[matchedKey].gmv += gmv;
          pStats[matchedKey].units += units;
          if (gmv > 0 || units > 0) pStats[matchedKey].days.add(dateStr);
        }
      });

      let totalDays = allUniqueDays.size;
      let html = '';

      Object.keys(pStats).forEach(platform => {
        let stats = pStats[platform];
        html += `
          <div class="bg-[#111111] border border-white/5 rounded-xl p-5 shadow-lg flex flex-col gap-3">
            <h3 class="text-sm font-semibold ${stats.color}">${platform}</h3>
            
            <div class="flex justify-between items-center text-sm border-b border-white/5 pb-2">
              <span class="text-gray-400">Sales</span>
              <span class="text-gray-100 font-medium">${formatNumber(stats.gmv)}</span>
            </div>
            
            <div class="flex justify-between items-center text-sm border-b border-white/5 pb-2">
              <span class="text-gray-400">Units</span>
              <span class="text-gray-100 font-medium">${formatNumber(stats.units, false)}</span>
            </div>
            
            <div class="flex justify-between items-center text-sm">
              <span class="text-gray-400">Active days</span>
              <span class="text-gray-100 font-medium">${stats.days.size}/${totalDays || 1}</span>
            </div>
          </div>
        `;
      });
      document.getElementById('platform-summary-grid').innerHTML = html;
    }

    function renderCharts(data) {
      const darkConfig = { mode: 'dark', background: 'transparent' };
      const brandColors = ['#EAB308', '#3B82F6', '#22C55E', '#DC2626', '#8B5CF6']; 

      const dailyMap = {};
      data.forEach(row => {
        const d = new Date(row.Date).toLocaleDateString('en-GB', {day: 'numeric', month: 'short'});
        if(!dailyMap[d]) dailyMap[d] = 0;
        dailyMap[d] += Number(row.GMV) || 0;
      });
      const sortedDates = Object.keys(dailyMap).sort((a, b) => new Date(a + ' 2026') - new Date(b + ' 2026'));
      const dailyValues = sortedDates.map(d => dailyMap[d]);

      const pMap = { 'Blinkit': 0, 'Zepto': 0, 'Instamart': 0, 'BigBasket': 0 };
      data.forEach(row => {
        let pName = String(row.Platform).toLowerCase();
        let gmv = Number(row.GMV) || 0;
        if (pName.includes('zepto')) pMap['Zepto'] += gmv;
        else if (pName.includes('blinkit')) pMap['Blinkit'] += gmv;
        else if (pName.includes('swiggy') || pName.includes('instamart')) pMap['Instamart'] += gmv;
        else if (pName.includes('big basket') || pName.includes('bigbasket')) pMap['BigBasket'] += gmv;
      });

      const prodMap = {};
      data.forEach(row => {
        let rawName = String(row['Product Name'] || 'Unknown').trim();
        
        // Force Title Case to merge mismatched names (e.g. "snackible" vs "Snackible")
        let pName = rawName.toLowerCase().split(' ').map(word => 
          word.charAt(0).toUpperCase() + word.slice(1)
        ).join(' ');

        if(!prodMap[pName]) prodMap[pName] = 0;
        prodMap[pName] += Number(row.GMV) || 0;
      });
      const topProducts = Object.entries(prodMap).sort((a,b) => b[1]-a[1]).slice(0,5);
      const topProdLabels = topProducts.map(p => p[0]); // Keeps the full product name
      const topProdValues = topProducts.map(p => p[1]);

      if(chartInstances.daily) chartInstances.daily.destroy();
      if(chartInstances.platform) chartInstances.platform.destroy();
      if(chartInstances.products) chartInstances.products.destroy();

      const optDaily = {
        series: [{ name: 'GMV', data: dailyValues }],
        chart: { type: 'bar', height: 320, toolbar: { show: false }, ...darkConfig },
        colors: ['#F97316'],
        plotOptions: { bar: { borderRadius: 4, columnWidth: '50%' } },
        dataLabels: { enabled: false },
        xaxis: { categories: sortedDates, labels: { style: { colors: '#9CA3AF' } }, axisBorder: { show: false } },
        yaxis: { labels: { formatter: (val) => formatNumber(val), style: { colors: '#9CA3AF' } } },
        grid: { borderColor: '#333', strokeDashArray: 4, yaxis: { lines: { show: true } } }
      };
      chartInstances.daily = new ApexCharts(document.querySelector("#chart-daily-trend"), optDaily);
      chartInstances.daily.render();

      const optPlatform = {
        series: Object.values(pMap),
        labels: Object.keys(pMap),
        chart: { type: 'donut', height: 280, ...darkConfig },
        colors: brandColors,
        stroke: { show: true, colors: '#111', width: 2 },
        dataLabels: { 
          enabled: true,
          style: { fontSize: '12px', fontWeight: 'bold' },
          dropShadow: { enabled: true, top: 1, left: 1, blur: 2, opacity: 0.8 }
        },
        legend: { position: 'bottom', labels: { colors: '#9CA3AF' } },
        tooltip: { 
          y: { 
            formatter: function(val, opts) {
               // Grabs the exact percentage calculated by the chart
               let percent = opts.w.globals.seriesPercent[opts.seriesIndex];
               return formatNumber(val) + " (" + percent.toFixed(1) + "%)";
            } 
          } 
        }
      };
      chartInstances.platform = new ApexCharts(document.querySelector("#chart-platform-share"), optPlatform);
      chartInstances.platform.render();

      const optProducts = {
        series: [{ name: 'GMV', data: topProdValues }],
        chart: { type: 'bar', height: 280, toolbar: { show: false }, ...darkConfig },
        colors: ['#8B5CF6'],
        plotOptions: { bar: { horizontal: true, borderRadius: 3 } },
        dataLabels: { enabled: false },
        // THE FIX: Moved categories to xaxis and added a tooltip formatter
        xaxis: { 
          categories: topProdLabels,
          labels: { formatter: (val) => formatNumber(val), style: { colors: '#9CA3AF' } }, 
          axisBorder: { show: false } 
        },
        yaxis: { 
          labels: { 
            style: { colors: '#E5E7EB' },
            maxWidth: 400, // Forces the chart to give enough width for long FMCG names
          } 
        },
        grid: { show: false },
        tooltip: { y: { formatter: (val) => formatNumber(val) } }
      };
      chartInstances.products = new ApexCharts(document.querySelector("#chart-top-products"), optProducts);
      chartInstances.products.render();
    }

    renderTabs();
    fetchAndRenderData();
  </script>
</body>
</html>
